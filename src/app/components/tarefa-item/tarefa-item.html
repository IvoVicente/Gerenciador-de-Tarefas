<article
  class="item"
  [class.item--concluida]="tarefa().concluida"
  [class.item--pendente]="!tarefa().concluida"
>
  <h3 class="item__titulo">{{ tarefa().titulo }}</h3>
  <p class="item__descricao">{{ tarefa().descricao }}</p>

  @if (tarefa().concluida) {
    <span class="status status--concluida">Concluída</span>
  } @else {
    <span class="status status--pendente">Pendente</span>
  }
</article>
